name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'README*.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/docs/**'
      - 'Tests/Docs/**'
      - '.agents/skills/**'
      - 'Tests/AegiNext.Rendering.Tests/Fixtures/README*.md'
      - 'src/AegiNext.Desktop/Assets/AppIcon.png'
      - 'src/AegiNext.Core/Effects/Scripts/fade-in-out.aegifx'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'README*.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/docs/**'
      - 'Tests/Docs/**'
      - '.agents/skills/**'
      - 'Tests/AegiNext.Rendering.Tests/Fixtures/README*.md'
      - 'src/AegiNext.Desktop/Assets/AppIcon.png'
      - 'src/AegiNext.Core/Effects/Scripts/fade-in-out.aegifx'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AEGINEXT_DOCS_REPOSITORY_URL: https://github.com/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r scripts/docs/requirements.txt
      - name: Test documentation build and links
        run: python -m unittest discover -s Tests/Docs -v
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Build documentation
        env:
          AEGINEXT_DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m mkdocs build --strict
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/docs-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
